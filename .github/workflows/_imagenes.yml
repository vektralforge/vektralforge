name: Imágenes (reutilizable)

# Construye las siete imágenes propias del stack. No se dispara solo: lo llaman
# `ci.yml` (en cada pull request, sin publicar) y `publicar-imagenes.yml` (en
# develop y en las etiquetas de versión, publicando en GHCR).
#
# La lista de imágenes vive SOLO aquí para que el CI de los PR y la publicación
# no puedan divergir: lo que se publica es exactamente lo que se probó.

on:
  workflow_call:
    inputs:
      publicar:
        description: "Empujar a GHCR (multi-arch) en vez de solo construir (amd64)"
        type: boolean
        default: false

# SIN bloque `permissions` a propósito. En un workflow reutilizable, declarar
# permisos aquí no es un techo inocuo: RECORTA los que entrega el llamador.
# Con `permissions: contents: read` el `packages: write` de
# publicar-imagenes.yml llegaba anulado, el login funcionaba igual y el push
# moría con «installation not allowed to Create organization package».
#
# Tampoco se declaran por job: pedir aquí `packages: write` haría que el
# llamador con solo `read` (ci.yml) ni siquiera arrancara. Los permisos los
# decide cada llamador:
#   ci.yml                 → contents: read, packages: read
#   publicar-imagenes.yml  → contents: read, packages: write

env:
  REGISTRO: ghcr.io/vektralforge

jobs:

  # Plataformas según el modo. En un PR basta amd64: es la arquitectura de los
  # runners, de la VM de producción y la rama del Dockerfile de RustFS que nunca
  # se había construido. arm64 lo cubre ya el desarrollo local en Apple Silicon.
  plataformas:
    name: Plataformas
    runs-on: ubuntu-24.04
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
    steps:
      - id: m
        env:
          PUBLICAR: ${{ inputs.publicar }}
        run: |
          if [ "$PUBLICAR" = "true" ]; then
            echo 'matriz=[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matriz=[{"arch":"amd64","runner":"ubuntu-24.04"}]' >> "$GITHUB_OUTPUT"
          fi

  construir:
    name: ${{ matrix.imagen.nombre }} (${{ matrix.plat.arch }})
    needs: plataformas
    # Runners NATIVOS por arquitectura, sin QEMU. Emular arm64 compilando la
    # imagen de Airflow (pip con ruedas nativas) o resolviendo Maven para Spark
    # multiplica el tiempo por cinco o más, y los runners arm64 son gratuitos
    # para repositorios públicos.
    runs-on: ${{ matrix.plat.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        plat: ${{ fromJSON(needs.plataformas.outputs.matriz) }}
        # `contexto` y `dockerfile` reproducen el bloque `build:` del Compose.
        # Si cambia allí, cambia aquí: stack.yml construye desde el Compose y
        # fallaría distinto que este job, lo que delata la divergencia.
        imagen:
          - { nombre: airflow,        contexto: ".",                                  dockerfile: infra/docker-compose/airflow/Dockerfile }
          - { nombre: rustfs,         contexto: ".",                                  dockerfile: infra/docker-compose/s3/Dockerfile }
          - { nombre: hive-metastore, contexto: ".",                                  dockerfile: infra/docker-compose/hive/Dockerfile }
          - { nombre: spark,          contexto: ".",                                  dockerfile: infra/docker-compose/spark/Dockerfile }
          - { nombre: trino,          contexto: ".",                                  dockerfile: infra/docker-compose/trino/Dockerfile }
          - { nombre: marquez-api,    contexto: infra/docker-compose/marquez,         dockerfile: infra/docker-compose/marquez/Dockerfile }
          - { nombre: superset,       contexto: infra/docker-compose/superset,        dockerfile: infra/docker-compose/superset/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login SIEMPRE, también en los PR. Los paquetes que crea un workflow en
      # una organización nacen privados; una lectura anónima de la caché daría
      # 401 y buildx lo trataría como un fallo de caché, sin error: el build
      # pasaría, solo que recompilando todo. Con el token del repositorio
      # (packages: read en los PR, write al publicar) la lectura funciona sea
      # cual sea la visibilidad, incluidos los PR de forks y de Dependabot.
      - name: Login en GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos OCI
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRO }}/${{ matrix.imagen.nombre }}
          labels: |
            org.opencontainers.image.title=vektralforge-${{ matrix.imagen.nombre }}
            org.opencontainers.image.licenses=Apache-2.0

      # La caché va al REGISTRO y no a la de Actions. El repositorio ya
      # aprendió en el #59 lo que pasa con 10 GB compartidos y entradas de GB:
      # desalojo continuo. Una por imagen y arquitectura, escrita solo al
      # publicar (desde develop); los PR solo la leen.
      #
      # Sin `outputs` en modo PR: buildx no exporta nada, así que una capa que
      # ya está en la caché ni siquiera se descarga. Un PR que no toca los
      # Dockerfiles termina en un par de minutos.
      - name: Construir${{ inputs.publicar && ' y publicar por digest' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.imagen.contexto }}
          file: ${{ matrix.imagen.dockerfile }}
          platforms: linux/${{ matrix.plat.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRO }}/${{ matrix.imagen.nombre }}:buildcache-${{ matrix.plat.arch }}
          cache-to: ${{ inputs.publicar && format('type=registry,ref={0}/{1}:buildcache-{2},mode=max', env.REGISTRO, matrix.imagen.nombre, matrix.plat.arch) || '' }}
          # Al publicar se empuja SOLO por digest, sin etiqueta: el manifiesto
          # multi-arch etiquetado lo crea el job `unir` cuando ambas
          # arquitecturas terminaron. Así nunca existe una etiqueta que apunte a
          # una imagen de una sola arquitectura.
          outputs: ${{ inputs.publicar && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRO, matrix.imagen.nombre) || '' }}
          provenance: ${{ inputs.publicar && 'mode=max' || 'false' }}
          sbom: ${{ inputs.publicar }}

      - name: Guardar digest
        if: inputs.publicar
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Subir digest
        if: inputs.publicar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.imagen.nombre }}-${{ matrix.plat.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  unir:
    name: Manifiesto ${{ matrix.nombre }}
    if: inputs.publicar
    needs: construir
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        nombre: [airflow, rustfs, hive-metastore, spark, trino, marquez-api, superset]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.nombre }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Etiquetas:
      #   develop        → `develop` y `sha-<corto>`
      #   v0.1.0         → `0.1.0`, `0.1`
      #   v0.1.0-rc.1    → `0.1.0-rc.1` (sin `0.1`: una RC no mueve la serie)
      # Nunca `latest`: con una 0.x y sin GA, `latest` promete una estabilidad
      # que el proyecto aún no ofrece.
      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRO }}/${{ matrix.nombre }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}

      - name: Crear manifiesto multi-arch
        working-directory: /tmp/digests
        env:
          IMAGEN: ${{ env.REGISTRO }}/${{ matrix.nombre }}
        run: |
          set -euo pipefail
          digests=(*)
          [ "${#digests[@]}" -eq 2 ] || { echo "✗ Se esperaban 2 digests (amd64 + arm64), hay ${#digests[@]}" >&2; exit 1; }

          etiquetas=()
          while IFS= read -r t; do etiquetas+=(-t "$t"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          fuentes=()
          for d in "${digests[@]}"; do fuentes+=("${IMAGEN}@sha256:${d}"); done

          docker buildx imagetools create "${etiquetas[@]}" "${fuentes[@]}"
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
