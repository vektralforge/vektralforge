name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: Check Signed-off-by
    # Fijado como en ci.yml: `ubuntu-latest` es móvil y cambia de
    # imagen sin aviso.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify every commit is signed off
        env:
          # El login de quien abrió el PR lo pone GitHub, no el commit.
          PR_AUTOR: ${{ github.event.pull_request.user.login }}
          # Por variable de entorno y no interpolados en el script: los nombres
          # de rama los elige quien abre el PR.
          RAMA_BASE: ${{ github.event.pull_request.base.ref }}
          RAMA_HEAD: ${{ github.event.pull_request.head.ref }}
          REPO_HEAD: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FAILED=0

          # El PR de release develop → main no se vuelve a verificar commit a
          # commit. Todo lo que hay en develop entró por un PR que ya pasó este
          # mismo control, y lo que se ve aquí no son esos commits sino los que
          # produjo el squash al fusionarlos, con otro autor y otras firmas:
          #
          #   - un PR de Dependabot pasa por la excepción de bots porque lo
          #     abrió el bot; el release lo abre una persona, y la excepción
          #     —a propósito— no se extiende a commits de bot en PR humanos;
          #   - un squash toma como autor el correo principal de la cuenta de
          #     GitHub de quien abrió el PR, que puede no coincidir con el de
          #     las líneas Signed-off-by que el squash copia de los commits
          #     originales.
          #
          # Así, el primer release (25 commits) fallaba en 12 que pasaron el
          # control al entrar en develop. Como develop no admite force-push,
          # su historial no se puede firmar de nuevo: el control se hace en la
          # entrada y aquí se omite. Solo con ambas ramas en este repositorio:
          # un fork puede llamar `develop` a una rama suya.
          if [ "$REPO_HEAD" = "$REPO" ] && [ "$RAMA_HEAD" = "develop" ] && [ "$RAMA_BASE" = "main" ]; then
            echo "Release develop → main: cada commit de develop ya pasó el DCO en su propio PR."
            exit 0
          fi

          for sha in $(git rev-list "$BASE".."$HEAD"); do
            # Merge commits are exempt
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              continue
            fi

            author_name=$(git log -1 --format='%an' "$sha")
            author_email=$(git log -1 --format='%ae' "$sha")

            # Los bots de la plataforma sí firman, pero con su dirección
            # canónica en vez del noreply que figura como autor del commit:
            #
            #   autor: dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>
            #   firma: Signed-off-by: dependabot[bot] <support@github.com>
            #
            # Exigir que nombre y correo coincidieran los rechazaba a todos, y
            # con ellos cualquier actualización de dependencias: 35 ejecuciones
            # de este workflow en rojo y 25 PRs bloqueados.
            #
            # No se les exime de firmar. Se acepta que firmen con otro correo,
            # exigiendo tres cosas a la vez: que el PR lo abriera un bot, que el
            # autor del commit sea ese mismo bot, y que exista un Signed-off-by
            # que lo nombre. El sufijo "[bot]" no lo puede falsificar una
            # persona —los nombres de usuario de GitHub no admiten corchetes— y
            # el login del autor del PR lo pone la plataforma.
            #
            # Un PR humano que incluya commits de bot no entra por aquí: se
            # compara contra quien abrió el PR, no contra el commit.
            case "${PR_AUTOR:-}" in
              *"[bot]")
                if [ "$author_name" = "$PR_AUTOR" ]; then
                  if git log -1 --format='%B' "$sha" | grep -qiF "Signed-off-by: ${author_name} <"; then
                    echo "ok   $sha ($author_name, firma con su propio correo)"
                    continue
                  fi
                  echo "FAIL $sha - $author_name no firmó el commit"
                  FAILED=1
                  continue
                fi
                ;;
            esac

            expected="Signed-off-by: ${author_name} <${author_email}>"

            if git log -1 --format='%B' "$sha" | grep -qiF "$expected"; then
              echo "ok   $sha"
            else
              echo "FAIL $sha - missing or mismatched: $expected"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            cat <<'MSG'

          One or more commits are missing a valid Signed-off-by line.

          Fix the most recent commit:
              git commit --amend -s --no-edit
              git push --force-with-lease

          Fix the last N commits:
              git rebase --signoff HEAD~N
              git push --force-with-lease

          See CONTRIBUTING.md for details on the Developer Certificate of Origin.
          MSG
            exit 1
          fi
