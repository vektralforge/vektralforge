# .github/dependabot.yml
#
# Vigila dependencias Python y, sobre todo, las etiquetas de las imágenes
# Docker: hasta ahora la versión de Airflow que realmente se ejecutaba no
# estaba siendo monitoreada por nadie.

version: 2
updates:

  # ── Python ─────────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/airflow"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      airflow-providers:
        patterns:
          - "apache-airflow-providers-*"
    labels:
      - "dependencies"
    # Spark 4.2 está BLOQUEADO, no olvidado (ver CHANGELOG y la subida a 4.1.3):
    # todas las delta-spark desde la 4.2.0 —4.4.1 incluida, comprobado el
    # 2026-10-07— exigen importlib_metadata<=8.7.1, y el constraints de
    # Airflow 3.3.0 fija ==9.0.0. Ninguna combinación con Spark 4.2 instala.
    # Los PR de Dependabot suben de a un sitio por vez sobre ocho, así que
    # además nunca podrían pasar test_pins_de_spark.py.
    #
    # Se dejan pasar los parches de 4.1. Quitar estas líneas —en los TRES
    # ecosistemas— cuando Airflow suelte el pin o Delta suba su tope, y hacer
    # la subida a mano en los ocho sitios a la vez.
    ignore:
      - dependency-name: "pyspark"
        versions: [">=4.2"]
      - dependency-name: "delta-spark"
        versions: [">=4.2"]

  - package-ecosystem: "pip"
    directory: "/spark"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Spark 4.2 bloqueado: ver la nota en el ecosistema pip de /airflow.
    ignore:
      - dependency-name: "pyspark"
        versions: [">=4.2"]
      - dependency-name: "delta-spark"
        versions: [">=4.2"]

  # ── Imágenes Docker ────────────────────────────────────────────────────────
  # Un directorio por Dockerfile. Ajustar si la estructura cambia.
  - package-ecosystem: "docker"
    directories:
      - "/infra/docker-compose/airflow"
      - "/infra/docker-compose/spark"
      - "/infra/docker-compose/superset"
      - "/infra/docker-compose/hive"
      - "/infra/docker-compose/marquez"
      - "/infra/docker-compose/s3"
      - "/infra/docker-compose/trino"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # apache/hive se queda en 4.0.0: la 4.0.1 elimina el método Thrift
    # `get_table` que necesita el cliente Hive 2.3.10 embebido en Spark 4.
    # Probado con 4.2.1 — el metastore arranca y toda escritura de tabla falla.
    # Ver la nota de compatibilidad del README antes de reactivar esto.
    # rustfs/rustfs se queda en 1.0.0-rc.6 hasta que exista una 1.0.0 estable.
    # Son candidatas a release: la cadencia es de varias por mes y Dependabot
    # abriría un PR por cada una. Además el Object Lock de RustFS falló abierto
    # dos veces en 2026 —issue #1509 y CVE-2026-73288, corregido en rc.1—, así
    # que subir de etiqueta aquí se revisa a mano y no por automatismo.
    ignore:
      - dependency-name: "apache/hive"
      - dependency-name: "rustfs/rustfs"
      # Spark 4.2 bloqueado: ver la nota en el ecosistema pip de /airflow.
      - dependency-name: "apache/spark"
        versions: [">=4.2"]

  # Imágenes referenciadas directamente en el Compose: postgres, valkey,
  # openbao, marquez-web y el par de Kafka. Las que se construyen viven en el
  # ecosistema `docker` de arriba, una entrada por Dockerfile.
  - package-ecosystem: "docker-compose"
    directory: "/infra/docker-compose"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Redis estaba fijado en 7.2 por licencia y nada lo impedía aquí: el #72
    # lo subió a 8.0 —RSALv2/SSPLv1/AGPLv3— y se fusionó como un bump más,
    # mientras README, arquitectura y THIRD-PARTY-NOTICES seguían diciendo 7.2
    # BSD. Una restricción que solo vive en la documentación no restringe nada.
    #
    # Para Valkey se dejan pasar parches y menores y se revisan a mano los
    # mayores, que es donde cambian licencias y comportamiento.
    ignore:
      - dependency-name: "valkey/valkey"
        update-types: ["version-update:semver-major"]
      # Lo mismo, otra vez: el Compose decía que Kafka y ZooKeeper se quedan
      # en 7.6.1 hasta migrar a KRaft —Confluent 8.x ya no habla con
      # ZooKeeper— y el #74 subió solo `cp-kafka` a 8.3.2, dejando el perfil
      # `streaming` sin arrancar. El salto a 8 llega con la migración, a mano.
      - dependency-name: "confluentinc/cp-kafka"
        versions: [">=8.0.0"]
      - dependency-name: "confluentinc/cp-zookeeper"
        versions: [">=8.0.0"]

  # ── Hooks de pre-commit ────────────────────────────────────────────────────
  # El `rev` de .pre-commit-config.yaml quedaba fuera de todo: nadie lo subía
  # con los requirements-dev, así que el hook local y el CI podían acabar
  # linteando con versiones distintas de ruff. GitHub soporta este ecosistema
  # desde marzo de 2026 y actualiza el `rev` como cualquier otra dependencia.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
