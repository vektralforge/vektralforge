# VektralForge — catálogo Delta Lake para Trino
#
# Rol de Trino en el stack: LECTURA SQL sobre las tablas Delta que escribe
# Spark. Las operaciones ACID (MERGE, UPDATE, DELETE, VACUUM) son de Spark;
# Trino no las soporta sobre Delta.
#
# Las credenciales se resuelven con ${ENV:...} al arrancar Trino, así que este
# archivo puede versionarse sin exponer secretos. Las variables se pasan al
# servicio trino desde docker-compose.yml.

connector.name=delta_lake

# ── Metastore ─────────────────────────────────────────────────────────────────
# Se usa el Hive Metastore compartido con Spark: es lo que permite que una
# tabla escrita por Spark sea consultable desde Trino sin registrarla dos veces.
#
# La alternativa file metastore guarda el catálogo en disco local y no se
# comparte con Spark; además, en /tmp se pierde al recrear el contenedor.
hive.metastore=thrift
hive.metastore.uri=thrift://hive-metastore:9083

# Alternativa sin Hive Metastore (catálogo local, no compartido con Spark):
# hive.metastore=file
# hive.metastore.catalog.dir=s3://metastore/   # en volumen persistente, no /tmp

# ── Almacenamiento de objetos (MinIO) ────────────────────────────────────────
# fs.native-s3 es el sistema de ficheros propio de Trino. No usa el S3A de
# Hadoop ni los JAR del AWS SDK, y a diferencia de las antiguas propiedades
# hive.s3.*, acepta rutas s3a:// — que es el esquema con el que Spark escribe
# en el _delta_log.
fs.native-s3.enabled=true
s3.endpoint=${ENV:MINIO_ENDPOINT}
s3.region=us-east-1
# Cuenta de servicio vf-trino, no la raíz: acotada a operar sobre los objetos de
# los cinco buckets por infra/docker-compose/minio/politica-datos.json.
#
# El identificador se resuelve con ${ENV:...}, que es lo que Trino sabe hacer.
# La clave NO: ${ENV:...} obliga a tenerla en el entorno del contenedor, donde
# la enseña `docker inspect`. En su lugar va un marcador, y el entrypoint
# escribe esta línea a partir del secreto que monta compose. Este archivo es
# por tanto una PLANTILLA: se monta en /etc/trino/catalog-plantilla y el
# catálogo real se renderiza en un tmpfs.
s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
s3.aws-secret-key=__MINIO_SECRET__
s3.path-style-access=true

# ── Seguridad ─────────────────────────────────────────────────────────────────
# ALLOW_ALL desactiva el control de acceso a nivel de catálogo. Es adecuado
# para desarrollo local, donde el stack no está expuesto.
#
# EN PRODUCCIÓN: cambiar a delta.security=SYSTEM y definir reglas de acceso, o
# usar un file-based access control. Ver:
# https://trino.io/docs/current/connector/delta-lake.html#authorization
delta.security=ALLOW_ALL

# Permite registrar tablas Delta existentes con CALL system.register_table().
# Los pipelines del repo NO lo necesitan: escriben con saveAsTable y quedan en
# el metastore compartido. Se deja habilitado para adoptar tablas Delta que ya
# existan en el object store sin pasar por Spark.
delta.register-table-procedure.enabled=true

# ── Escrituras ────────────────────────────────────────────────────────────────
# Habilita escrituras desde Trino sin coordinación de concurrencia. Se activa
# solo para poder validar el stack de extremo a extremo en desarrollo.
#
# EN PRODUCCIÓN: mantener en false. Spark es el motor de escritura ACID; dos
# escritores sin coordinación sobre la misma tabla Delta pueden corromper el
# _delta_log.
delta.enable-non-concurrent-writes=true

# ── Rendimiento ───────────────────────────────────────────────────────────────
# Tiempo que Trino cachea los metadatos de una tabla Delta. Un valor bajo hace
# que Trino vea antes lo que acaba de escribir Spark, a costa de más lecturas
# del _delta_log. Diez minutos es un compromiso razonable en desarrollo; en
# producción, con escrituras menos frecuentes, puede subirse.
delta.metadata.cache-ttl=10m
