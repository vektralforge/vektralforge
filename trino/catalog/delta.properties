# Trino — conector Delta Lake (SOLO LECTURA)
# IMPORTANTE: Trino lee Delta Lake. Spark escribe Delta Lake.
# Para escrituras ACID (MERGE, UPDATE, DELETE) usar Spark.
#
# Configuración para MinIO local con filesystem nativo Trino
connector.name=delta_lake
hive.metastore.uri=thrift://hive-metastore:9083

# Filesystem nativo Trino (no S3A de Hadoop)
hive.s3-file-system-type=TRINO
hive.s3.endpoint=http://minio:9000
hive.s3.aws-access-key=minioadmin
hive.s3.aws-secret-key=minioadmin
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false

# Deshabilitar validación de paths externos (requerido para MinIO)
delta.security=ALLOW_ALL

delta.metadata.cache-ttl=10m
