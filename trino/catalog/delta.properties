# Trino — conector Delta Lake
# Usa file metastore local (no requiere Hive Metastore)
connector.name=delta_lake
hive.metastore=file
hive.metastore.catalog.dir=/tmp/trino-file-metastore

# Filesystem nativo Trino para MinIO
hive.s3-file-system-type=TRINO
hive.s3.endpoint=http://minio:9000
hive.s3.aws-access-key=minioadmin
hive.s3.aws-secret-key=minioadmin
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false

# Seguridad
delta.security=ALLOW_ALL
delta.register-table-procedure.enabled=true

# Habilitar escrituras en S3 para PoC local
# NOTA: En producción Spark es el motor de escritura ACID — Trino solo lee
delta.enable-non-concurrent-writes=true

delta.metadata.cache-ttl=10m
