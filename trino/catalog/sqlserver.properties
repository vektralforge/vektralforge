# ─────────────────────────────────────────────────────────────────────────────
# trino/catalog/sqlserver.properties
# Conector SQL Server para Trino — permite consultas federadas.
# Reemplazar con credenciales reales (usar secretos de Vault en producción).
# ─────────────────────────────────────────────────────────────────────────────
connector.name=sqlserver
connection-url=jdbc:sqlserver://sqlserver-host:1433;databaseName=DWH
connection-user=${ENV:SQLSERVER_USER}
connection-password=${ENV:SQLSERVER_PASSWORD}
