# ─────────────────────────────────────────────────────────────────────────────
# pre-commit hooks — lakeforge
# Instalación: pre-commit install
# Ejecución manual: pre-commit run --all-files
# ─────────────────────────────────────────────────────────────────────────────
repos:
  # Validaciones básicas
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  # Detección de secretos (CRÍTICO — bloquea en los 3 escenarios CI/CD)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # Ruff — lint + format Python (Airflow DAGs + Spark jobs)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format
