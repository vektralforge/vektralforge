# ─────────────────────────────────────────────────────────────────────────────
# airflow/ruff.toml — configuración Ruff para DAGs de Airflow
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["dags", "plugins"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
