# VektralForge — stack de desarrollo local
#
# Uso:  make dev-up      (no invocar docker compose directamente: el Makefile
#                         pasa --env-file, sin el cual las variables no se expanden)
#
# Requiere infra/docker-compose/.env — ver .env.example en la raíz del repo.

x-airflow-common: &airflow-common
  image: vektralforge/airflow:3.3.0
  build:
    context: ../..
    dockerfile: infra/docker-compose/airflow/Dockerfile
  # Aquí había `env_file: .env`, que entregaba el archivo ENTERO como variables
  # de entorno a los cuatro contenedores de Airflow: no solo la clave de
  # Postgres, también la de MinIO, las de admin de Airflow y Superset, y el
  # token de OpenBao. Un `docker inspect` sobre cualquiera las enseñaba todas.
  #
  # Ahora la lista es explícita. Si Airflow necesita una variable nueva del
  # .env, se añade aquí y se ve en el diff, que es justamente lo que el
  # env_file impedía.
  environment:
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # _CMD en vez del valor: Airflow ejecuta el comando y usa su salida, así la
    # contraseña llega del secreto montado y no del entorno. El script hace el
    # quote() de usuario y clave, que un '@' o un '/' romperían.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: /opt/vektralforge/bin/cadena_de_conexion.py
    POSTGRES_USER: ${POSTGRES_USER}
    AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://marquez-api:9000", "endpoint": "api/v1/lineage"}'
    AIRFLOW__OPENLINEAGE__NAMESPACE: "vektralforge"
    AIRFLOW__OPENLINEAGE__DISABLED: "false"
    # El provider de OpenLineage inyecta en cada spark-submit el parent job
    # (para que el run de Spark cuelgue de su tarea en Marquez) y la URL de
    # transporte. Sin esto el listener de Spark no sabría a dónde emitir y los
    # dos runs aparecerían como grafos separados.
    AIRFLOW__OPENLINEAGE__SPARK_INJECT_PARENT_JOB_INFO: "true"
    AIRFLOW__OPENLINEAGE__SPARK_INJECT_TRANSPORT_INFO: "true"
    # Credenciales de MinIO para S3A y boto3. Aquí viaja solo el
    # IDENTIFICADOR de la cuenta, que no es un secreto; la clave la entrega
    # compose como archivo y el entrypoint la materializa en dos sitios que sí
    # sabe leer cada consumidor: core-site.xml para S3A y el INI del SDK para
    # boto3. Ver infra/docker-compose/comun/credenciales_minio.sh.
    #
    # Nunca como propiedad de Spark: ahí acabaría en la línea de comandos de
    # spark-submit y en la UI del driver.
    #
    # Es la cuenta de servicio vf-pipeline, NO la raíz. Antes aquí iban
    # MINIO_ROOT_USER y MINIO_ROOT_PASSWORD, con lo que estos contenedores
    # podían borrar todos los buckets y administrar el servidor. La política que
    # las acota está en infra/docker-compose/minio/politica-datos.json y la
    # aplica `init_users.sh cuentas`.
    MINIO_ACCESS_KEY: ${MINIO_PIPELINE_ACCESS_KEY:-vf-pipeline}
    MINIO_SECRET_KEY_FILE: /run/secrets/minio_pipeline_secret_key
    # Catálogo compartido con Trino. El driver de Spark corre en este
    # contenedor, así que es aquí donde se resuelve.
    HIVE_METASTORE_URIS: thrift://hive-metastore:9083
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__STANDALONE_DAG_PROCESSOR: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    # Las cuatro que antes llegaban de rebote por el env_file. Airflow lee las
    # AIRFLOW__* y AIRFLOW_CONN_* directamente del entorno; MINIO_ENDPOINT la
    # leen los DAGs con os.environ.
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY}
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW_CONN_SPARK_DEFAULT: ${AIRFLOW_CONN_SPARK_DEFAULT}
    MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  secrets:
    - postgres_password
    - minio_pipeline_secret_key
  volumes:
    - ../../airflow/dags:/opt/airflow/dags
    - ../../airflow/plugins:/opt/airflow/plugins
    - airflow-logs:/opt/airflow/logs
    - ../../spark/jobs:/opt/spark/jobs
    # Caché de Ivy: sin esto, spark-submit vuelve a descargar las dependencias
    # de Delta desde Maven en cada ejecución de tarea.
    - ivy-cache:/home/airflow/.ivy2
    # docker.sock eliminado: montarlo da control del demonio Docker del host
    # a los contenedores de Airflow (escalada a root efectiva). Descomentar
    # solo si se usa DockerOperator, y documentarlo en SECURITY.md.
    # - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    postgres:
      condition: service_healthy
    marquez-api:
      condition: service_healthy

services:

  # ── PostgreSQL (Airflow + Metastore + Marquez + Superset) ─────────────────
  # init-multiple-dbs.sh SOLO se ejecuta al crear el volumen. Si se añade una
  # base a POSTGRES_MULTIPLE_DATABASES hay que hacer `make dev-reset`.
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      # La imagen oficial acepta el sufijo _FILE en cualquier POSTGRES_*: lee el
      # valor del archivo en vez del entorno. Así la clave no sale en
      # `docker inspect` ni en /proc/1/environ.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-airflow,metastore,marquez,superset}
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Todos los puertos publicados se atan a la interfaz de loopback. Compose,
    # si no se le dice nada, escucha en 0.0.0.0: en una red compartida eso deja
    # accesibles Postgres con su contraseña, Redis sin ninguna, MinIO con las
    # credenciales root, OpenBao en modo dev y —lo más serio— el puerto 7077 de
    # spark-master, que acepta el envío de jobs sin autenticación.
    #
    # No se pierde nada: los contenedores se hablan por la red interna del
    # Compose, no por estos puertos. BIND_HOST=0.0.0.0 los reabre para quien
    # necesite alcanzar el stack desde otra máquina.
    ports:
      - "${BIND_HOST:-127.0.0.1}:5432:5432"

  # ── MinIO ─────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${BIND_HOST:-127.0.0.1}:9000:9000"
      - "${BIND_HOST:-127.0.0.1}:9001:9001"
    healthcheck:
      # `mc ready` en vez de curl: la imagen de MinIO no siempre incluye curl,
      # y sin él el healthcheck falla aunque el servicio esté sano.
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Hive Metastore ────────────────────────────────────────────────────────
  hive-metastore:
    image: vektralforge/hive-metastore:4.0.0
    build:
      context: ../..
      dockerfile: infra/docker-compose/hive/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      # SERVICE_OPTS iba aquí con las cuatro propiedades JDO, contraseña
      # incluida. El entrypoint de la imagen lo concatena a HADOOP_CLIENT_OPTS,
      # es decir, a la línea de comandos de la JVM: la veía cualquier proceso
      # dentro del contenedor con un `ps`, y `docker top` desde fuera. Ahora las
      # cuatro se escriben en hive-site.xml al arrancar. Se deja vacía y no sin
      # definir porque el entrypoint de arriba la expande sin comprobar.
      SERVICE_OPTS: ""
      METASTORE_DB_URL: jdbc:postgresql://postgres:5432/metastore
      METASTORE_DB_USER: ${POSTGRES_USER}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_HIVE_ACCESS_KEY:-vf-hive}
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_hive_secret_key
    secrets:
      - postgres_password
      - minio_hive_secret_key
    ports:
      - "${BIND_HOST:-127.0.0.1}:9083:9083"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Spark ─────────────────────────────────────────────────────────────────
  spark-master:
    image: vektralforge/spark:4.1.3
    build:
      context: ../..
      dockerfile: infra/docker-compose/spark/Dockerfile
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    volumes:
      - ../../spark/jobs:/opt/spark/jobs:ro
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8082"
      OPENLINEAGE_URL: http://marquez-api:9000
      OPENLINEAGE_NAMESPACE: vektralforge
      # Solo el identificador. La clave llega como archivo y el entrypoint la
      # escribe en el core-site.xml de SPARK_CONF_DIR, que es donde S3A la busca.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_PIPELINE_ACCESS_KEY:-vf-pipeline}
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_pipeline_secret_key
      HIVE_METASTORE_URIS: thrift://hive-metastore:9083
    secrets:
      - minio_pipeline_secret_key
    ports:
      - "${BIND_HOST:-127.0.0.1}:7077:7077"
      - "${BIND_HOST:-127.0.0.1}:8082:8082"

  spark-worker:
    image: vektralforge/spark:4.1.3
    build:
      context: ../..
      dockerfile: infra/docker-compose/spark/Dockerfile
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ../../spark/jobs:/opt/spark/jobs:ro
    environment:
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1g}
      SPARK_WORKER_CORES: "${SPARK_WORKER_CORES:-2}"
      SPARK_WORKER_WEBUI_PORT: "8083"
      OPENLINEAGE_URL: http://marquez-api:9000
      OPENLINEAGE_NAMESPACE: vektralforge
      # Los executors resuelven las credenciales de S3A desde el
      # core-site.xml que el entrypoint escribe en el arranque. Antes las leían
      # del entorno, con EnvironmentVariableCredentialsProvider.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_PIPELINE_ACCESS_KEY:-vf-pipeline}
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_pipeline_secret_key
      HIVE_METASTORE_URIS: thrift://hive-metastore:9083
    secrets:
      - minio_pipeline_secret_key
    ports:
      - "${BIND_HOST:-127.0.0.1}:8083:8083"
    depends_on:
      - spark-master

  # ── Trino ─────────────────────────────────────────────────────────────────
  trino:
    image: vektralforge/trino:448
    build:
      context: ../..
      dockerfile: infra/docker-compose/trino/Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_TRINO_ACCESS_KEY:-vf-trino}
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_trino_secret_key
    secrets:
      - minio_trino_secret_key
    volumes:
      # De solo lectura y como PLANTILLA: Trino no sabe leer un secreto de un
      # archivo, solo resolver ${ENV:...}, así que el entrypoint renderiza el
      # catálogo real en /etc/trino/catalog con la clave del secreto montado.
      - ../../trino/catalog:/etc/trino/catalog-plantilla:ro
    ports:
      - "${BIND_HOST:-127.0.0.1}:8081:8080"
    depends_on:
      - hive-metastore
      - minio

  # ── Kafka ─────────────────────────────────────────────────────────────────
  # Kafka y ZooKeeper quedan detrás del perfil "streaming": `docker compose up`
  # no los arranca. El README ya decía que están en el stack sin pipeline aún, y
  # dos contenedores encendidos por si acaso cuestan memoria en cada arranque.
  #
  # Cuando llegue la Fase 2 habrá que migrar a KRaft antes de subir de versión:
  # Confluent Platform 7.9.x es la última que incluye ZooKeeper, y la imagen 8.x
  # ya no habla con él. Por eso este par se queda en 7.6.1 y no se actualiza.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    profiles: ["streaming"]
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    profiles: ["streaming"]
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "${BIND_HOST:-127.0.0.1}:9092:9092"

  # ── OpenBao ───────────────────────────────────────────────────────────────
  # Modo -dev: almacenamiento en memoria y sellado automático. Solo desarrollo.
  openbao:
    image: openbao/openbao:2.1.0
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_TOKEN}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    ports:
      - "${BIND_HOST:-127.0.0.1}:8200:8200"

  # ── Marquez API (backend de OpenLineage) ──────────────────────────────────
  # Configuración vía marquez.yml embebido en la imagen: Marquez no lee la
  # conexión a la BD desde variables de entorno.
  # Puerto 9000 interno → 9100 externo (evita AirPlay :5000 y MinIO :9000 en macOS)
  marquez-api:
    build: ./marquez
    restart: unless-stopped
    platform: linux/amd64
    environment:
      MARQUEZ_DB_HOST: postgres
      MARQUEZ_DB_PORT: "5432"
      MARQUEZ_DB_NAME: marquez
      MARQUEZ_DB_USER: ${POSTGRES_USER}
      MARQUEZ_DB_PASSWORD_FILE: /run/secrets/postgres_password
      MARQUEZ_LOG_LEVEL: ${MARQUEZ_LOG_LEVEL:-INFO}
    secrets:
      - postgres_password
    ports:
      - "${BIND_HOST:-127.0.0.1}:9100:9000"
      - "${BIND_HOST:-127.0.0.1}:9101:9001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ── Marquez Web (UI de linaje) ────────────────────────────────────────────
  marquez-web:
    image: marquezproject/marquez-web:latest
    restart: unless-stopped
    platform: linux/amd64
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: 9000
      WEB_PORT: 3000
    ports:
      - "${BIND_HOST:-127.0.0.1}:3000:3000"
    depends_on:
      marquez-api:
        condition: service_healthy

  # ── Airflow ───────────────────────────────────────────────────────────────
  # `db migrate` reemplaza a `db init`, eliminado en Airflow 3.
  airflow-init:
    image: vektralforge/airflow:3.3.0
    build:
      context: ../..
      dockerfile: infra/docker-compose/airflow/Dockerfile
    # Este servicio no usa el ancla: lleva su propia lista, y solo necesita
    # llegar a la base para migrarla.
    environment:
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: /opt/vektralforge/bin/cadena_de_conexion.py
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      # No habla con MinIO, así que no recibe ni la cuenta ni el secreto. El
      # entrypoint exige los dos salvo que se le diga que no aquí: preferimos
      # que un servicio nuevo al que se le olvide la cuenta no arranque, a que
      # arranque y falle con un 403 media hora después.
      VF_CREDENCIALES_MINIO: "no"
    secrets:
      - postgres_password
    command: db migrate
    restart: "no"
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/plugins:/opt/airflow/plugins
      - airflow-logs:/opt/airflow/logs
      - ../../spark/jobs:/opt/spark/jobs
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    restart: unless-stopped
    # Airflow 3 sirve la UI con `api-server`; `webserver` fue eliminado en 3.0.
    # Si esta imagen aún acepta `webserver`, cambiar aquí para volver atrás.
    command: api-server
    ports:
      - "${BIND_HOST:-127.0.0.1}:8090:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Airflow 3 ejecuta el parseo de DAGs en un proceso propio.
  airflow-dag-processor:
    <<: *airflow-common
    restart: unless-stopped
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Redis ─────────────────────────────────────────────────────────────────
  # Caché de Superset. Lo configura infra/docker-compose/superset/superset_config.py;
  # sin ese archivo las cachés de Superset son NullCache y esto no recibe nada.
  redis:
    image: redis:7.2
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Superset ──────────────────────────────────────────────────────────────
  # Base de metadatos propia: compartir la de Airflow mezcla dos aplicaciones
  # en un mismo esquema y complica los respaldos y las migraciones.
  superset:
    build: ./superset
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      # La cadena se arma en superset_config.py con la clave leída del secreto.
      # Antes venía entera por DATABASE_URL, contraseña incluida.
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_DB: superset
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    secrets:
      - postgres_password
    ports:
      - "${BIND_HOST:-127.0.0.1}:8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

# El origen `environment` toma el valor de POSTGRES_PASSWORD del .env y lo
# entrega como archivo en /run/secrets/. No queda en el entorno del contenedor,
# así que no aparece en `docker inspect` ni en /proc/<pid>/environ. Requiere
# Compose 2.20 o superior.
secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  # Una cuenta de servicio por consumidor, cada una con su secreto: así el
  # radio de una filtración sigue siendo el de la cuenta y no el del stack.
  # Los IDENTIFICADORES no están aquí — van en environment:, porque no son
  # secretos y llevan valor por defecto para que un .env anterior siga
  # funcionando. Los secretos, a propósito, no llevan defecto: sin ellos el
  # arranque debe fallar y no continuar con una credencial vacía.
  minio_pipeline_secret_key:
    environment: MINIO_PIPELINE_SECRET_KEY
  minio_hive_secret_key:
    environment: MINIO_HIVE_SECRET_KEY
  minio_trino_secret_key:
    environment: MINIO_TRINO_SECRET_KEY

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
  ivy-cache:
