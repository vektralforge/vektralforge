# VektralForge — stack de desarrollo local
#
# Uso:  make dev-up      (no invocar docker compose directamente: el Makefile
#                         pasa --env-file, sin el cual las variables no se expanden)
#
# Requiere infra/docker-compose/.env — ver .env.example en la raíz del repo.

x-airflow-common: &airflow-common
  image: vektralforge/airflow:3.3.0
  build:
    context: ../..
    dockerfile: infra/docker-compose/airflow/Dockerfile
  env_file: .env
  environment:
    # La cadena de conexión se construye AQUÍ, no en el .env.
    # Compose interpola ${...}; el .env no interpola sus propias variables,
    # así que definirla allí produce un usuario literal "POSTGRES_USER".
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://marquez-api:9000", "endpoint": "api/v1/lineage"}'
    AIRFLOW__OPENLINEAGE__NAMESPACE: "vektralforge"
    AIRFLOW__OPENLINEAGE__DISABLED: "false"
    # El provider de OpenLineage inyecta en cada spark-submit el parent job
    # (para que el run de Spark cuelgue de su tarea en Marquez) y la URL de
    # transporte. Sin esto el listener de Spark no sabría a dónde emitir y los
    # dos runs aparecerían como grafos separados.
    AIRFLOW__OPENLINEAGE__SPARK_INJECT_PARENT_JOB_INFO: "true"
    AIRFLOW__OPENLINEAGE__SPARK_INJECT_TRANSPORT_INFO: "true"
    # Credenciales de MinIO para S3A y boto3. Se pasan como variables de
    # entorno y NUNCA como propiedades de Spark: una propiedad viaja en la
    # línea de comandos de spark-submit y aparece en la UI del driver.
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    # Catálogo compartido con Trino. El driver de Spark corre en este
    # contenedor, así que es aquí donde se resuelve.
    HIVE_METASTORE_URIS: thrift://hive-metastore:9083
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__STANDALONE_DAG_PROCESSOR: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
  volumes:
    - ../../airflow/dags:/opt/airflow/dags
    - ../../airflow/plugins:/opt/airflow/plugins
    - airflow-logs:/opt/airflow/logs
    - ../../spark/jobs:/opt/spark/jobs
    # Caché de Ivy: sin esto, spark-submit vuelve a descargar las dependencias
    # de Delta desde Maven en cada ejecución de tarea.
    - ivy-cache:/home/airflow/.ivy2
    # docker.sock eliminado: montarlo da control del demonio Docker del host
    # a los contenedores de Airflow (escalada a root efectiva). Descomentar
    # solo si se usa DockerOperator, y documentarlo en SECURITY.md.
    # - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    postgres:
      condition: service_healthy
    marquez-api:
      condition: service_healthy

services:

  # ── PostgreSQL (Airflow + Metastore + Marquez + Superset) ─────────────────
  # init-multiple-dbs.sh SOLO se ejecuta al crear el volumen. Si se añade una
  # base a POSTGRES_MULTIPLE_DATABASES hay que hacer `make dev-reset`.
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-airflow,metastore,marquez,superset}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # ── MinIO ─────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      # `mc ready` en vez de curl: la imagen de MinIO no siempre incluye curl,
      # y sin él el healthcheck falla aunque el servicio esté sano.
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Hive Metastore ────────────────────────────────────────────────────────
  hive-metastore:
    image: vektralforge/hive-metastore:4.0.0
    build:
      context: ../..
      dockerfile: infra/docker-compose/hive/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: "-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore -Djavax.jdo.option.ConnectionUserName=${POSTGRES_USER} -Djavax.jdo.option.ConnectionPassword=${POSTGRES_PASSWORD}"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9083:9083"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Spark ─────────────────────────────────────────────────────────────────
  spark-master:
    image: vektralforge/spark:4.0.0
    build:
      context: ../..
      dockerfile: infra/docker-compose/spark/Dockerfile
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    volumes:
      - ../../spark/jobs:/opt/spark/jobs:ro
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8082"
      OPENLINEAGE_URL: http://marquez-api:9000
      OPENLINEAGE_NAMESPACE: vektralforge
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      HIVE_METASTORE_URIS: thrift://hive-metastore:9083
    ports:
      - "7077:7077"
      - "8082:8082"

  spark-worker:
    image: vektralforge/spark:4.0.0
    build:
      context: ../..
      dockerfile: infra/docker-compose/spark/Dockerfile
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ../../spark/jobs:/opt/spark/jobs:ro
    environment:
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1g}
      SPARK_WORKER_CORES: "${SPARK_WORKER_CORES:-2}"
      SPARK_WORKER_WEBUI_PORT: "8083"
      OPENLINEAGE_URL: http://marquez-api:9000
      OPENLINEAGE_NAMESPACE: vektralforge
      # Los executors resuelven las credenciales de S3A desde el entorno.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      HIVE_METASTORE_URIS: thrift://hive-metastore:9083
    ports:
      - "8083:8083"
    depends_on:
      - spark-master

  # ── Trino ─────────────────────────────────────────────────────────────────
  trino:
    image: trinodb/trino:448
    restart: unless-stopped
    mem_limit: 768m
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ../../trino/catalog:/etc/trino/catalog
    ports:
      - "8081:8080"
    depends_on:
      - hive-metastore
      - minio

  # ── Kafka ─────────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  # ── OpenBao ───────────────────────────────────────────────────────────────
  # Modo -dev: almacenamiento en memoria y sellado automático. Solo desarrollo.
  openbao:
    image: openbao/openbao:2.1.0
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_TOKEN}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    ports:
      - "8200:8200"

  # ── Marquez API (backend de OpenLineage) ──────────────────────────────────
  # Configuración vía marquez.yml embebido en la imagen: Marquez no lee la
  # conexión a la BD desde variables de entorno.
  # Puerto 9000 interno → 9100 externo (evita AirPlay :5000 y MinIO :9000 en macOS)
  marquez-api:
    build: ./marquez
    restart: unless-stopped
    platform: linux/amd64
    environment:
      MARQUEZ_DB_HOST: postgres
      MARQUEZ_DB_PORT: "5432"
      MARQUEZ_DB_NAME: marquez
      MARQUEZ_DB_USER: ${POSTGRES_USER}
      MARQUEZ_DB_PASSWORD: ${POSTGRES_PASSWORD}
      MARQUEZ_LOG_LEVEL: ${MARQUEZ_LOG_LEVEL:-INFO}
    ports:
      - "9100:9000"
      - "9101:9001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ── Marquez Web (UI de linaje) ────────────────────────────────────────────
  marquez-web:
    image: marquezproject/marquez-web:latest
    restart: unless-stopped
    platform: linux/amd64
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: 9000
      WEB_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      marquez-api:
        condition: service_healthy

  # ── Airflow ───────────────────────────────────────────────────────────────
  # `db migrate` reemplaza a `db init`, eliminado en Airflow 3.
  airflow-init:
    image: vektralforge/airflow:3.3.0
    build:
      context: ../..
      dockerfile: infra/docker-compose/airflow/Dockerfile
    env_file: .env
    environment:
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    command: db migrate
    restart: "no"
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/plugins:/opt/airflow/plugins
      - airflow-logs:/opt/airflow/logs
      - ../../spark/jobs:/opt/spark/jobs
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    restart: unless-stopped
    # Airflow 3 sirve la UI con `api-server`; `webserver` fue eliminado en 3.0.
    # Si esta imagen aún acepta `webserver`, cambiar aquí para volver atrás.
    command: api-server
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Airflow 3 ejecuta el parseo de DAGs en un proceso propio.
  airflow-dag-processor:
    <<: *airflow-common
    restart: unless-stopped
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ── Superset ──────────────────────────────────────────────────────────────
  # Base de metadatos propia: compartir la de Airflow mezcla dos aplicaciones
  # en un mismo esquema y complica los respaldos y las migraciones.
  superset:
    build: ./superset
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/superset
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
  ivy-cache:
