# Stack completo lakeforge para desarrollo local.
# OpenBao reemplaza HashiCorp Vault (MPL 2.0 / Linux Foundation).
version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1
  env_file: .env
  volumes:
    - ../../airflow/dags:/opt/airflow/dags
    - ../../airflow/plugins:/opt/airflow/plugins
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: lakeforge
      POSTGRES_PASSWORD: lakeforge
      POSTGRES_MULTIPLE_DATABASES: airflow,metastore
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lakeforge"]
      interval: 10s
      retries: 5
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      retries: 3

  hive-metastore:
    image: apache/hive:4.0.0
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=lakeforge
        -Djavax.jdo.option.ConnectionPassword=lakeforge
    ports:
      - "9083:9083"
    depends_on:
      postgres:
        condition: service_healthy

  spark-master:
    image: bitnami/spark:3.5.1
    environment:
      SPARK_MODE: master
    ports:
      - "7077:7077"
      - "8082:8080"

  spark-worker:
    image: bitnami/spark:3.5.1
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 4G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master

  trino:
    image: trinodb/trino:448
    volumes:
      - ../../trino/catalog:/etc/trino/catalog
    ports:
      - "8081:8080"
    depends_on:
      - hive-metastore
      - minio

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  # ── OpenBao (reemplaza HashiCorp Vault — MPL 2.0 / Linux Foundation) ────────
  openbao:
    image: openbao/openbao:2.0.0
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-root-token
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 10s
      retries: 5

  airflow-init:
    <<: *airflow-common
    command: db init
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"

  superset:
    image: apache/superset:3.1.3
    environment:
      SUPERSET_SECRET_KEY: lakeforge-local-secret
      DATABASE_URL: postgresql+psycopg2://lakeforge:lakeforge@postgres:5432/airflow
    ports:
      - "8088:8088"
    depends_on:
      - postgres
      - redis

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
