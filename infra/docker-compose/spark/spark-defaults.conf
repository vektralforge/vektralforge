# VektralForge — configuración por defecto de Spark
#
# Se copia a $SPARK_CONF_DIR en la imagen de Spark y en la de Airflow: con
# SparkSubmitOperator en modo client el driver corre en el contenedor de
# Airflow, así que el listener tiene que estar declarado en ambos lados.
#
# Solo va aquí lo que no depende del entorno. La URL de Marquez y el parent
# job los inyecta el provider de OpenLineage de Airflow en cada submit
# (AIRFLOW__OPENLINEAGE__SPARK_INJECT_TRANSPORT_INFO y
# ..._SPARK_INJECT_PARENT_JOB_INFO en docker-compose.yml).
#
# Sin transporte configurado, OpenLineage usa el tipo `console`: un
# spark-submit manual imprime los eventos en el log en vez de fallar.

spark.extraListeners    io.openlineage.spark.agent.OpenLineageSparkListener
