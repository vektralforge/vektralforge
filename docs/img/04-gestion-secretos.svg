<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="#FAFAFA" rx="8"/>
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F4E79">VektralForge — Gestión de Secretos por Ambiente</text>

  <!-- LOCAL -->
  <rect x="30" y="55" width="240" height="200" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="150" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532D">LOCAL</text>
  <text x="150" y="95" text-anchor="middle" font-size="10" fill="#166534">make dev-up</text>
  <rect x="50" y="105" width="200" height="60" rx="6" fill="#BBF7D0" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="150" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532D">.env file</text>
  <text x="150" y="145" text-anchor="middle" font-size="9" fill="#166534">Variables de entorno en texto</text>
  <text x="150" y="158" text-anchor="middle" font-size="9" fill="#166534">NUNCA commitear a Git</text>
  <text x="150" y="175" text-anchor="middle" font-size="9" fill="#166534">Licencia: —</text>
  <text x="150" y="195" text-anchor="middle" font-size="9" fill="#166534">Herramienta: archivo local</text>
  <rect x="50" y="215" width="200" height="30" rx="4" fill="#DCFCE7" stroke="#86EFAC"/>
  <text x="150" y="234" text-anchor="middle" font-size="9" fill="#166534">Agregado a .gitignore automáticamente</text>

  <!-- STAGING -->
  <rect x="330" y="55" width="240" height="200" rx="8" fill="#FEF9C3" stroke="#EAB308" stroke-width="2"/>
  <text x="450" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#713F12">STAGING</text>
  <text x="450" y="95" text-anchor="middle" font-size="10" fill="#92400E">K3s namespace staging</text>
  <rect x="350" y="105" width="200" height="60" rx="6" fill="#FEF08A" stroke="#FDE047" stroke-width="1.5"/>
  <text x="450" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#713F12">Sealed Secrets</text>
  <text x="450" y="145" text-anchor="middle" font-size="9" fill="#92400E">Secretos cifrados en Git</text>
  <text x="450" y="158" text-anchor="middle" font-size="9" fill="#92400E">Descifrado por K3s en runtime</text>
  <text x="450" y="175" text-anchor="middle" font-size="9" fill="#92400E">Licencia: Apache 2.0</text>
  <text x="450" y="195" text-anchor="middle" font-size="9" fill="#92400E">kubeseal + controller</text>
  <rect x="350" y="215" width="200" height="30" rx="4" fill="#FEF9C3" stroke="#FDE68A"/>
  <text x="450" y="234" text-anchor="middle" font-size="9" fill="#92400E">infra/k3s/secrets/*.yaml (sealed)</text>

  <!-- PRODUCCIÓN -->
  <rect x="630" y="55" width="240" height="200" rx="8" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2"/>
  <text x="750" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#881337">PRODUCCIÓN</text>
  <text x="750" y="95" text-anchor="middle" font-size="10" fill="#9F1239">K3s namespace prod</text>
  <rect x="650" y="105" width="200" height="60" rx="6" fill="#FFE4E6" stroke="#FB7185" stroke-width="1.5"/>
  <text x="750" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#881337">OpenBao</text>
  <text x="750" y="137" text-anchor="middle" font-size="9" fill="#9F1239">Fork OSS de HashiCorp Vault</text>
  <text x="750" y="150" text-anchor="middle" font-size="9" fill="#9F1239">MPL 2.0 · Linux Foundation</text>
  <text x="750" y="163" text-anchor="middle" font-size="9" fill="#9F1239">API 100% compatible con Vault</text>
  <rect x="650" y="175" width="200" height="30" rx="4" fill="#FFE4E6" stroke="#FB7185"/>
  <text x="750" y="194" text-anchor="middle" font-size="9" fill="#9F1239">Rotación automática · Auditoría</text>
  <rect x="650" y="215" width="200" height="30" rx="4" fill="#FFF1F2" stroke="#FDA4AF"/>
  <text x="750" y="234" text-anchor="middle" font-size="9" fill="#9F1239">Namespaces incluidos (sin pagar)</text>

  <!-- CONSUMIDORES -->
  <rect x="30" y="305" width="840" height="80" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="450" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E40AF">CONSUMIDORES DE SECRETOS</text>
  <rect x="120" y="335" width="160" height="35" rx="5" fill="#BFDBFE" stroke="#60A5FA"/>
  <text x="200" y="357" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E3A8A">Apache Airflow</text>
  <rect x="370" y="335" width="160" height="35" rx="5" fill="#BFDBFE" stroke="#60A5FA"/>
  <text x="450" y="357" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E3A8A">Apache Spark</text>
  <rect x="620" y="335" width="160" height="35" rx="5" fill="#BFDBFE" stroke="#60A5FA"/>
  <text x="700" y="357" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E3A8A">Trino</text>

  <!-- Arrows from secrets to consumers -->
  <line x1="150" y1="255" x2="200" y2="305" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="450" y1="255" x2="450" y2="305" stroke="#EAB308" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="750" y1="255" x2="700" y2="305" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="750" y1="255" x2="450" y2="305" stroke="#F43F5E" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr)"/>

  <!-- Por qué OpenBao nota -->
  <rect x="30" y="395" width="840" height="18" rx="4" fill="#FFF7ED"/>
  <text x="450" y="408" text-anchor="middle" font-size="9" fill="#7C2D12">⚠ HashiCorp Vault cambió a BSL v1.1 en agosto 2023 (ya no es open source) — OpenBao es el fork MPL 2.0 con API 100% compatible bajo Linux Foundation</text>

  <text x="450" y="418" text-anchor="middle" font-size="7" fill="#94A3B8">ALEPH SERVER LTDA. — vektralforge v2.0 — 2026</text>
</svg>
