<svg viewBox="0 0 920 580" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="920" height="580" fill="#FAFAFA" rx="8"/>
  <text x="460" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F4E79">Lakeforge — Stack de Servicios (Docker Compose / K3s)</text>

  <!-- ORQUESTACIÓN -->
  <rect x="20" y="50" width="200" height="110" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="120" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E40AF">ORQUESTACIÓN</text>
  <rect x="35" y="78" width="170" height="32" rx="4" fill="#BFDBFE" stroke="#60A5FA" stroke-width="1"/>
  <text x="120" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E3A8A">Airflow Webserver</text>
  <text x="120" y="105" text-anchor="middle" font-size="9" fill="#1E40AF">http://localhost:8090</text>
  <rect x="35" y="116" width="170" height="32" rx="4" fill="#BFDBFE" stroke="#60A5FA" stroke-width="1"/>
  <text x="120" y="131" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E3A8A">Airflow Scheduler</text>
  <text x="120" y="143" text-anchor="middle" font-size="9" fill="#1E40AF">python 3.12</text>

  <!-- STREAMING -->
  <rect x="240" y="50" width="200" height="110" rx="8" fill="#FEF9C3" stroke="#EAB308" stroke-width="1.5"/>
  <text x="340" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#713F12">STREAMING</text>
  <rect x="255" y="78" width="170" height="32" rx="4" fill="#FEF08A" stroke="#FDE047" stroke-width="1"/>
  <text x="340" y="95" text-anchor="middle" font-size="10" font-weight="bold" fill="#713F12">Apache Zookeeper</text>
  <rect x="255" y="116" width="170" height="32" rx="4" fill="#FEF08A" stroke="#FDE047" stroke-width="1"/>
  <text x="340" y="133" text-anchor="middle" font-size="10" font-weight="bold" fill="#713F12">Apache Kafka</text>
  <text x="340" y="145" text-anchor="middle" font-size="9" fill="#92400E">localhost:9092</text>

  <!-- PROCESAMIENTO -->
  <rect x="460" y="50" width="200" height="110" rx="8" fill="#FDF4FF" stroke="#A855F7" stroke-width="1.5"/>
  <text x="560" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#581C87">PROCESAMIENTO</text>
  <rect x="475" y="78" width="170" height="32" rx="4" fill="#E9D5FF" stroke="#C084FC" stroke-width="1"/>
  <text x="560" y="95" text-anchor="middle" font-size="10" font-weight="bold" fill="#581C87">Spark Master</text>
  <text x="560" y="107" text-anchor="middle" font-size="9" fill="#6B21A8">:7077 / :8082</text>
  <rect x="475" y="116" width="170" height="32" rx="4" fill="#E9D5FF" stroke="#C084FC" stroke-width="1"/>
  <text x="560" y="133" text-anchor="middle" font-size="10" font-weight="bold" fill="#581C87">Spark Worker</text>
  <text x="560" y="145" text-anchor="middle" font-size="9" fill="#6B21A8">:8083 · 1g RAM</text>

  <!-- SECRETOS -->
  <rect x="680" y="50" width="220" height="110" rx="8" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="790" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#881337">SECRETOS</text>
  <rect x="695" y="78" width="190" height="32" rx="4" fill="#FFE4E6" stroke="#FB7185" stroke-width="1"/>
  <text x="790" y="95" text-anchor="middle" font-size="10" font-weight="bold" fill="#881337">OpenBao</text>
  <text x="790" y="107" text-anchor="middle" font-size="9" fill="#9F1239">MPL 2.0 / Linux Foundation</text>
  <rect x="695" y="116" width="190" height="32" rx="4" fill="#FFE4E6" stroke="#FB7185" stroke-width="1"/>
  <text x="790" y="133" text-anchor="middle" font-size="10" font-weight="bold" fill="#881337">http://localhost:8200</text>
  <text x="790" y="145" text-anchor="middle" font-size="9" fill="#9F1239">token: dev-root-token</text>

  <!-- OBJECT STORAGE - MinIO (centro) -->
  <rect x="240" y="200" width="440" height="100" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="460" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532D">OBJECT STORAGE — MinIO</text>
  <text x="460" y="235" text-anchor="middle" font-size="9" fill="#166534">http://localhost:9000 (API) · http://localhost:9001 (Console)</text>
  <rect x="258" y="242" width="90" height="44" rx="4" fill="#BBF7D0" stroke="#4ADE80" stroke-width="1"/>
  <text x="303" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532D">raw/</text>
  <text x="303" y="274" text-anchor="middle" font-size="9" fill="#166534">30 días</text>
  <rect x="358" y="242" width="90" height="44" rx="4" fill="#86EFAC" stroke="#4ADE80" stroke-width="1"/>
  <text x="403" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532D">bronze/</text>
  <text x="403" y="274" text-anchor="middle" font-size="9" fill="#166534">Delta ACID</text>
  <rect x="458" y="242" width="90" height="44" rx="4" fill="#86EFAC" stroke="#4ADE80" stroke-width="1"/>
  <text x="503" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532D">silver/</text>
  <text x="503" y="274" text-anchor="middle" font-size="9" fill="#166534">Delta ACID</text>
  <rect x="558" y="242" width="90" height="44" rx="4" fill="#86EFAC" stroke="#4ADE80" stroke-width="1"/>
  <text x="603" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532D">gold/</text>
  <text x="603" y="274" text-anchor="middle" font-size="9" fill="#166534">Delta ACID</text>

  <!-- CATÁLOGO -->
  <rect x="20" y="350" width="200" height="110" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="120" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#7C2D12">CATÁLOGO</text>
  <rect x="35" y="378" width="170" height="32" rx="4" fill="#FED7AA" stroke="#FB923C" stroke-width="1"/>
  <text x="120" y="395" text-anchor="middle" font-size="10" font-weight="bold" fill="#7C2D12">Hive Metastore</text>
  <text x="120" y="407" text-anchor="middle" font-size="9" fill="#9A3412">thrift://localhost:9083</text>
  <rect x="35" y="416" width="170" height="32" rx="4" fill="#FED7AA" stroke="#FB923C" stroke-width="1"/>
  <text x="120" y="433" text-anchor="middle" font-size="10" font-weight="bold" fill="#7C2D12">PostgreSQL</text>
  <text x="120" y="445" text-anchor="middle" font-size="9" fill="#9A3412">localhost:5432</text>

  <!-- CONSULTA SQL -->
  <rect x="240" y="350" width="200" height="110" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="340" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#064E3B">CONSULTA SQL</text>
  <rect x="255" y="378" width="170" height="70" rx="4" fill="#A7F3D0" stroke="#34D399" stroke-width="1"/>
  <text x="340" y="403" text-anchor="middle" font-size="12" font-weight="bold" fill="#064E3B">Trino</text>
  <text x="340" y="420" text-anchor="middle" font-size="9" fill="#065F46">http://localhost:8081</text>
  <text x="340" y="434" text-anchor="middle" font-size="9" fill="#065F46">file metastore local</text>

  <!-- VISUALIZACIÓN -->
  <rect x="460" y="350" width="200" height="110" rx="8" fill="#EFF6FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="560" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#312E81">VISUALIZACIÓN</text>
  <rect x="475" y="378" width="170" height="32" rx="4" fill="#C7D2FE" stroke="#818CF8" stroke-width="1"/>
  <text x="560" y="395" text-anchor="middle" font-size="10" font-weight="bold" fill="#312E81">Apache Superset</text>
  <text x="560" y="407" text-anchor="middle" font-size="9" fill="#3730A3">http://localhost:8088</text>
  <rect x="475" y="416" width="170" height="32" rx="4" fill="#C7D2FE" stroke="#818CF8" stroke-width="1"/>
  <text x="560" y="433" text-anchor="middle" font-size="10" font-weight="bold" fill="#312E81">Redis</text>
  <text x="560" y="445" text-anchor="middle" font-size="9" fill="#3730A3">localhost:6379 · caché</text>

  <!-- BD POSTGRES -->
  <rect x="680" y="350" width="220" height="110" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="790" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#4C1D95">BASE DE DATOS</text>
  <rect x="695" y="378" width="190" height="70" rx="4" fill="#DDD6FE" stroke="#A78BFA" stroke-width="1"/>
  <text x="790" y="403" text-anchor="middle" font-size="10" font-weight="bold" fill="#4C1D95">PostgreSQL</text>
  <text x="790" y="418" text-anchor="middle" font-size="9" fill="#5B21B6">airflow · metastore</text>
  <text x="790" y="432" text-anchor="middle" font-size="9" fill="#5B21B6">localhost:5432</text>

  <!-- ARROWS -->
  <!-- Airflow → Spark -->
  <path d="M 220 100 Q 340 160 460 105" stroke="#3B82F6" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="340" y="152" text-anchor="middle" font-size="8" fill="#1E40AF">spark-submit</text>

  <!-- Airflow → MinIO -->
  <line x1="120" y1="160" x2="280" y2="200" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="185" y="188" text-anchor="middle" font-size="8" fill="#1E40AF">escribe raw/</text>

  <!-- Spark → MinIO -->
  <line x1="560" y1="160" x2="500" y2="200" stroke="#A855F7" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="548" y="188" text-anchor="middle" font-size="8" fill="#6B21A8">escribe ACID</text>

  <!-- MinIO → Trino -->
  <line x1="340" y1="300" x2="340" y2="350" stroke="#22C55E" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="355" y="332" font-size="8" fill="#166534">lee SQL</text>

  <!-- Trino → Hive -->
  <line x1="255" y1="405" x2="220" y2="405" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr)"/>
  <text x="236" y="398" text-anchor="middle" font-size="8" fill="#065F46">catálogo</text>

  <!-- Trino → Superset -->
  <line x1="440" y1="405" x2="460" y2="405" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- OpenBao → Airflow -->
  <path d="M 790 160 Q 790 185 700 185 Q 350 185 220 140" stroke="#F43F5E" stroke-width="1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <text x="500" y="178" text-anchor="middle" font-size="8" fill="#9F1239">credenciales</text>

  <!-- Footer -->
  <text x="460" y="572" text-anchor="middle" font-size="8" fill="#94A3B8">ALEPH SERVER LTDA. — lakeforge v2.0 — 2026</text>
</svg>
