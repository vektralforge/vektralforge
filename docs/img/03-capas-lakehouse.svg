  <text x="450" y="432" text-anchor="middle" font-size="8" fill="#94A3B8">ALEPH SERVER LTDA. — vektralforge v2.0 — 2026  ·  gold/ = Agregaciones y métricas · Consumo vía Trino → Superset / Power BI</text>
