<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="560" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F4E79">VektralForge — Flujo de datos end-to-end</text>

  <!-- FUENTES -->
  <rect x="20" y="55" width="160" height="110" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="100" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E40AF">FUENTES</text>
  <rect x="35" y="83" width="130" height="24" rx="4" fill="#BFDBFE" stroke="#60A5FA" stroke-width="1"/>
  <text x="100" y="99" text-anchor="middle" font-size="10" fill="#1E3A8A">SQL Server / DWH</text>
  <rect x="35" y="112" width="130" height="24" rx="4" fill="#BFDBFE" stroke="#60A5FA" stroke-width="1"/>
  <text x="100" y="128" text-anchor="middle" font-size="10" fill="#1E3A8A">APIs REST</text>
  <rect x="35" y="141" width="130" height="24" rx="4" fill="#BFDBFE" stroke="#60A5FA" stroke-width="1"/>
  <text x="100" y="157" text-anchor="middle" font-size="10" fill="#1E3A8A">CSV / Excel</text>

  <!-- Arrow Fuentes → Ingesta -->
  <line x1="180" y1="110" x2="218" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- INGESTA -->
  <rect x="220" y="55" width="160" height="110" rx="8" fill="#FEF9C3" stroke="#EAB308" stroke-width="1.5"/>
  <text x="300" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#713F12">INGESTA</text>
  <rect x="235" y="83" width="130" height="24" rx="4" fill="#FEF08A" stroke="#FDE047" stroke-width="1"/>
  <text x="300" y="99" text-anchor="middle" font-size="10" fill="#713F12">Apache Airflow</text>
  <text x="300" y="110" text-anchor="middle" font-size="9" fill="#92400E">(batch)</text>
  <rect x="235" y="120" width="130" height="24" rx="4" fill="#FEF08A" stroke="#FDE047" stroke-width="1"/>
  <text x="300" y="136" text-anchor="middle" font-size="10" fill="#713F12">Apache Kafka</text>
  <text x="300" y="147" text-anchor="middle" font-size="9" fill="#92400E">(streaming)</text>

  <!-- Arrow Ingesta → MinIO -->
  <line x1="380" y1="110" x2="418" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- MINIO -->
  <rect x="420" y="40" width="200" height="270" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5"/>
  <text x="520" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532D">OBJECT STORAGE — MinIO</text>
  <rect x="438" y="70" width="164" height="44" rx="4" fill="#BBF7D0" stroke="#4ADE80" stroke-width="1"/>
  <text x="520" y="88" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532D">raw/</text>
  <text x="520" y="104" text-anchor="middle" font-size="9" fill="#166534">30 días · datos crudos</text>
  <rect x="438" y="122" width="164" height="44" rx="4" fill="#86EFAC" stroke="#4ADE80" stroke-width="1"/>
  <text x="520" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532D">bronze/</text>
  <text x="520" y="156" text-anchor="middle" font-size="9" fill="#166534">90 días · Delta Lake ACID</text>
  <rect x="438" y="174" width="164" height="44" rx="4" fill="#86EFAC" stroke="#4ADE80" stroke-width="1"/>
  <text x="520" y="192" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532D">silver/</text>
  <text x="520" y="208" text-anchor="middle" font-size="9" fill="#166534">indefinido · Delta Lake ACID</text>
  <rect x="438" y="226" width="164" height="44" rx="4" fill="#86EFAC" stroke="#4ADE80" stroke-width="1"/>
  <text x="520" y="244" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532D">gold/</text>
  <text x="520" y="260" text-anchor="middle" font-size="9" fill="#166534">indefinido · Delta Lake ACID</text>
  <!-- Spark label inside MinIO -->
  <text x="520" y="298" text-anchor="middle" font-size="9" fill="#166534" font-style="italic">↑ Spark escribe ACID</text>

  <!-- Arrow MinIO → Spark -->
  <line x1="620" y1="180" x2="658" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PROCESAMIENTO -->
  <rect x="660" y="55" width="160" height="160" rx="8" fill="#FDF4FF" stroke="#A855F7" stroke-width="1.5"/>
  <text x="740" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#581C87">PROCESAMIENTO</text>
  <rect x="675" y="83" width="130" height="50" rx="4" fill="#E9D5FF" stroke="#C084FC" stroke-width="1"/>
  <text x="740" y="103" text-anchor="middle" font-size="10" font-weight="bold" fill="#581C87">Apache Spark</text>
  <text x="740" y="117" text-anchor="middle" font-size="9" fill="#6B21A8">Escritura ACID</text>
  <text x="740" y="128" text-anchor="middle" font-size="9" fill="#6B21A8">MERGE · UPDATE · DELETE</text>
  <rect x="675" y="143" width="130" height="50" rx="4" fill="#E9D5FF" stroke="#C084FC" stroke-width="1"/>
  <text x="740" y="163" text-anchor="middle" font-size="10" font-weight="bold" fill="#581C87">Trino</text>
  <text x="740" y="177" text-anchor="middle" font-size="9" fill="#6B21A8">Lectura SQL</text>
  <text x="740" y="188" text-anchor="middle" font-size="9" fill="#6B21A8">queries ad-hoc</text>

  <!-- Spark escribe en MinIO (loop back) -->
  <path d="M 660 110 Q 640 80 620 92" stroke="#A855F7" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow-purple)"/>
  <text x="635" y="78" text-anchor="middle" font-size="8" fill="#6B21A8">escribe ACID</text>

  <!-- Trino lee de MinIO -->
  <path d="M 620 200 Q 640 210 660 175" stroke="#22C55E" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="635" y="218" text-anchor="middle" font-size="8" fill="#166534">lee SQL</text>

  <!-- Arrow Trino → Consumo -->
  <line x1="820" y1="168" x2="858" y2="168" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CONSUMO -->
  <rect x="860" y="55" width="30" height="230" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="875" y="95" text-anchor="middle" font-size="9" font-weight="bold" fill="#991B1B" transform="rotate(-90 875 170)">CONSUMO</text>

  <!-- Nota Spark/Trino -->
  <rect x="20" y="360" width="860" height="50" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="450" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#C2410C">Regla fundamental del lakehouse</text>
  <text x="450" y="398" text-anchor="middle" font-size="11" fill="#9A3412">Spark escribe (ACID: MERGE, UPDATE, DELETE, VACUUM)   ·   Trino lee (SQL ad-hoc, consultas federadas)</text>

  <!-- Tabla motores -->
  <rect x="20" y="425" width="860" height="115" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="450" y="447" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E293B">Separación de responsabilidades</text>
  <!-- Headers -->
  <rect x="30" y="455" width="280" height="22" rx="3" fill="#1F4E79"/>
  <rect x="315" y="455" width="200" height="22" rx="3" fill="#1F4E79"/>
  <rect x="520" y="455" width="350" height="22" rx="3" fill="#1F4E79"/>
  <text x="170" y="470" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Operación</text>
  <text x="415" y="470" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Motor</text>
  <text x="695" y="470" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Razón</text>
  <!-- Rows -->
  <text x="40" y="491" font-size="9" fill="#374151">Escribir en Delta Lake (ACID)</text>
  <text x="325" y="491" font-size="9" font-weight="bold" fill="#581C87">Apache Spark</text>
  <text x="530" y="491" font-size="9" fill="#374151">Único con soporte nativo completo</text>
  <text x="40" y="507" font-size="9" fill="#374151">Streaming Kafka → Delta Lake</text>
  <text x="325" y="507" font-size="9" font-weight="bold" fill="#581C87">Spark Structured Streaming</text>
  <text x="530" y="507" font-size="9" fill="#374151">Integración nativa Kafka + Delta</text>
  <text x="40" y="523" font-size="9" fill="#374151">Consultas SQL ad-hoc</text>
  <text x="325" y="523" font-size="9" font-weight="bold" fill="#166534">Trino</text>
  <text x="530" y="523" font-size="9" fill="#374151">Motor SQL federado, más rápido para queries</text>
  <text x="40" y="539" font-size="9" fill="#374151">Consultas federadas multi-fuente</text>
  <text x="325" y="539" font-size="9" font-weight="bold" fill="#166534">Trino</text>
  <text x="530" y="539" font-size="9" fill="#374151">Delta Lake + SQL Server en un solo SELECT</text>

  <!-- Footer -->
  <text x="450" y="555" text-anchor="middle" font-size="8" fill="#94A3B8">ALEPH SERVER LTDA. — vektralforge v2.0 — 2026</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#A855F7"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22C55E"/>
    </marker>
  </defs>
</svg>
